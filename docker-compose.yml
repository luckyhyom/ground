# 로컬 개발용 인프라. 앱은 호스트에서 `pnpm start:dev` 로 실행한다.
#   docker-compose up -d        # MySQL 시작
#   docker-compose down         # 중지 (데이터 유지)
#   docker-compose down -v      # 중지 + 데이터 삭제
name: ground

services:
  mysql:
    image: mysql:8.4
    container_name: ground-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ground}
      MYSQL_USER: ${MYSQL_USER:-ground}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ground}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
